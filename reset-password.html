<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitur Lupa Password</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-message {
            display: none;
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 style="text-align: center; margin-top: 0;">Reset Password</h2>
        
        <form id="resetForm" action="/api/v1/reset-password" method="POST">
            
            <div class="form-group">
                <label for="new_password">Password Baru</label>
                <input type="password" id="new_password" name="new_password" placeholder="Masukkan password baru" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Ulangi Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Ulangi password baru" required>
            </div>

            <div id="error_msg" class="error-message" aria-live="polite">
                Password dan Ulangi Password tidak cocok!
            </div>

            <button type="submit" id="submitBtn">Register</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('resetForm');
            const newPassword = document.getElementById('new_password');
            const confirmPassword = document.getElementById('confirm_password');
            const errorMsg = document.getElementById('error_msg');

            form.addEventListener('submit', function(event) {
                if (newPassword.value !== confirmPassword.value) {
                    event.preventDefault();
                    errorMsg.style.display = 'block';
                } else {
                    errorMsg.style.display = 'none';
                }
            });

            confirmPassword.addEventListener('input', function() {
                if (confirmPassword.value !== newPassword.value && confirmPassword.value !== "") {
                    errorMsg.style.display = 'block';
                } else {
                    errorMsg.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
