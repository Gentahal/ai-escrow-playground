<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitur Lupa Password</title>
    <!-- Memanggil file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2 style="text-align: center; margin-top: 0;">Reset Password</h2>
        
        <!-- Action diperbarui untuk menunjuk ke endpoint backend -->
        <form id="resetForm" action="/api/v1/reset-password" method="POST">
            
            <div class="form-group">
                <label for="new_password">Password Baru</label>
                <input type="password" id="new_password" name="new_password" placeholder="Masukkan password baru" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Ulangi Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Ulangi password baru" required>
            </div>

            <div id="error_msg" class="error-message">
                Password dan Ulangi Password tidak cocok!
            </div>

            <!-- Teks tombol diperbarui agar sesuai dengan logika bisnis -->
            <button type="submit">Setel Kata Sandi Baru</button>
        </form>
    </div>

    <!-- Memanggil file JavaScript eksternal -->
    <script src="script.js"></script>
</body>
</html>
